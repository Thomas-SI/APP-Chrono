<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plan du Village · Marathon Brooks Annecy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--blue:#034065;--green:#50af31;--bg:#f0f4f7;--white:#fff;--text:#034065;--text2:#4a7a9b;--text3:#8aabbc;--border:rgba(3,64,101,0.12);}
body{background:#000;font-family:'Barlow',sans-serif;height:100vh;overflow:hidden;display:flex;justify-content:center;}
.page{width:100%;max-width:430px;height:100vh;display:flex;flex-direction:column;position:relative;}

/* HEADER */
.header{background:var(--blue);padding:14px 16px 12px;flex-shrink:0;position:relative;z-index:10;}
.back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.back-btn{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#fff;}
.page-sub{font-size:11px;color:rgba(255,255,255,0.55);}

/* FILTRES */
.filters{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;background:var(--white);flex-shrink:0;position:relative;z-index:10;box-shadow:0 2px 8px rgba(3,64,101,0.08);}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;height:28px;padding:0 11px;border-radius:20px;border:0.5px solid var(--border);background:var(--white);color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.fdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* MAP CONTAINER */
.map-container{flex:1;position:relative;overflow:hidden;background:#a8c8a0;cursor:grab;}
.map-container.grabbing{cursor:grabbing;}
.map-inner{position:absolute;transform-origin:0 0;will-change:transform;}
.map-inner svg{display:block;}

/* ZOOM CONTROLS */
.zoom-controls{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:20;}
.zoom-btn{width:36px;height:36px;background:var(--white);border:0.5px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text);box-shadow:0 2px 8px rgba(3,64,101,0.15);font-family:inherit;}
.zoom-hint{position:absolute;left:12px;bottom:16px;background:rgba(3,64,101,0.7);color:#fff;font-size:10px;padding:5px 10px;border-radius:20px;z-index:20;}

/* FICHE */
.overlay{position:absolute;inset:0;background:rgba(3,64,101,0.25);z-index:30;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.overlay.show{opacity:1;pointer-events:all;}
.stand-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--white);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(3,64,101,0.2);transform:translateY(100%);transition:transform 0.3s ease;z-index:40;max-height:80vh;display:flex;flex-direction:column;}
.stand-sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sheet-close{position:absolute;top:12px;right:14px;background:var(--bg);border:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text2);line-height:1;}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px;}
.sheet-header{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px;}
.sheet-icon-big{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.sheet-name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--text);line-height:1.1;}
.sheet-cat-lbl{font-size:11px;font-weight:600;color:var(--text2);margin-top:3px;text-transform:uppercase;letter-spacing:0.05em;}
.sheet-body{padding:0 16px;}
.info-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border);}
.info-row:last-child{border-bottom:none;}
.info-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0;margin-top:1px;}
.info-label{font-size:10px;color:var(--text3);margin-bottom:1px;}
.info-val{font-size:13px;font-weight:500;color:var(--text);line-height:1.4;}

/* CARTE RESTAU */
.menu-section{padding:0 16px;}
.menu-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;padding:12px 0 8px;border-top:0.5px solid var(--border);}
.menu-cat{font-size:12px;font-weight:600;color:var(--blue);margin:10px 0 6px;}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid var(--border);}
.menu-item:last-child{border-bottom:none;}
.menu-item-name{font-size:13px;color:var(--text);font-weight:500;}
.menu-item-desc{font-size:11px;color:var(--text3);margin-top:1px;}
.menu-item-price{font-size:13px;font-weight:700;color:var(--blue);flex-shrink:0;margin-left:10px;}
</style>
</head>

var activeFilter="all";
var scale=0.45,tx=0,ty=0;
var dragging=false,lastX=0,lastY=0;
var pinching=false,lastDist=0;

function setFilter(cat,btn){
  activeFilter=cat;
  document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active");});
  btn.classList.add("active");
  renderPins();
}

function renderPins(){
  var g=document.getElementById("pinsGroup");
  g.innerHTML="";
  stands.forEach(function(s){
    if(activeFilter!=="all"&&s.cat!==activeFilter)return;
    var pin=document.createElementNS("http://www.w3.org/2000/svg","g");
    pin.setAttribute("cursor","pointer");
    pin.setAttribute("onclick","openStand('"+s.id+"')");
    pin.setAttribute("style","filter:drop-shadow(0px 3px 4px rgba(0,0,0,0.4))");

    var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",s.x);c.setAttribute("cy",s.y);c.setAttribute("r","18");
    c.setAttribute("fill",s.color);c.setAttribute("stroke","#fff");c.setAttribute("stroke-width","2.5");
    pin.appendChild(c);

    var tip=document.createElementNS("http://www.w3.org/2000/svg","polygon");
    tip.setAttribute("points",(s.x-7)+","+(s.y+14)+" "+s.x+","+(s.y+26)+" "+(s.x+7)+","+(s.y+14));
    tip.setAttribute("fill",s.color);
    pin.appendChild(tip);

    var t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",s.x);t.setAttribute("y",s.y+6);
    t.setAttribute("text-anchor","middle");t.setAttribute("font-size","16");
    t.textContent=s.icon;
    pin.appendChild(t);
    g.appendChild(pin);
  });
}

function applyTransform(){
  var el=document.getElementById("mapInner");
  el.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")";
}

function zoom(factor){
  var container=document.getElementById("mapContainer");
  var cx=container.clientWidth/2;
  var cy=container.clientHeight/2;
  tx=cx-(cx-tx)*factor;
  ty=cy-(cy-ty)*factor;
  scale*=factor;
  scale=Math.max(0.3,Math.min(4,scale));
  applyTransform();
}

function clampPan(){
  var container=document.getElementById("mapContainer");
  var mapW=900*scale,mapH=700*scale;
  var cw=container.clientWidth,ch=container.clientHeight;
  var minX=Math.min(0,cw-mapW),minY=Math.min(0,ch-mapH);
  tx=Math.max(minX,Math.min(0,tx));
  ty=Math.max(minY,Math.min(0,ty));
}

var container=document.getElementById("mapContainer");

// TOUCH EVENTS
container.addEventListener("touchstart",function(e){
  if(e.touches.length===2){
    pinching=true;
    lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  } else if(e.touches.length===1){
    dragging=true;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }
},{passive:true});

container.addEventListener("touchmove",function(e){
  if(pinching&&e.touches.length===2){
    var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    var factor=dist/lastDist;
    var mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    var my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    var rect=container.getBoundingClientRect();
    var lx=mx-rect.left,ly=my-rect.top;
    tx=lx-(lx-tx)*factor;
    ty=ly-(ly-ty)*factor;
    scale*=factor;scale=Math.max(0.25,Math.min(5,scale));
    lastDist=dist;
    clampPan();applyTransform();
  } else if(dragging&&e.touches.length===1){
    var dx=e.touches[0].clientX-lastX;
    var dy=e.touches[0].clientY-lastY;
    tx+=dx;ty+=dy;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
    clampPan();applyTransform();
  }
  e.preventDefault();
},{passive:false});

container.addEventListener("touchend",function(){dragging=false;pinching=false;},{passive:true});

// MOUSE EVENTS
container.addEventListener("mousedown",function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;container.classList.add("grabbing");});
container.addEventListener("mousemove",function(e){if(!dragging)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clampPan();applyTransform();});
container.addEventListener("mouseup",function(){dragging=false;container.classList.remove("grabbing");});
container.addEventListener("mouseleave",function(){dragging=false;container.classList.remove("grabbing");});
container.addEventListener("wheel",function(e){e.preventDefault();var factor=e.deltaY<0?1.15:0.87;var rect=container.getBoundingClientRect();var lx=e.clientX-rect.left,ly=e.clientY-rect.top;tx=lx-(lx-tx)*factor;ty=ly-(ly-ty)*factor;scale*=factor;scale=Math.max(0.25,Math.min(5,scale));clampPan();applyTransform();},{passive:false});

function openStand(id){
  var s=stands.filter(function(x){return x.id===id;})[0];
  if(!s)return;
  document.getElementById("sheetIcon").textContent=s.icon;
  document.getElementById("sheetIcon").style.background=s.color+"22";
  document.getElementById("sheetName").textContent=s.name;
  document.getElementById("sheetCat").textContent=s.cat_label;
  document.getElementById("sheetBody").innerHTML=s.infos.map(function(info){
    return'<div class="info-row"><div class="info-icon">'+info.icon+'</div><div><div class="info-label">'+info.label+'</div><div class="info-val">'+info.val+'</div></div></div>';
  }).join("");
  var menuSec=document.getElementById("menuSection");
  var menuContent=document.getElementById("menuContent");
  if(s.menu&&s.menu.length){
    menuSec.style.display="block";
    menuContent.innerHTML=s.menu.map(function(cat){
      return'<div class="menu-cat">'+cat.cat+'</div>'+cat.items.map(function(item){
        return'<div class="menu-item"><div><div class="menu-item-name">'+item.n+'</div>'+(item.desc?'<div class="menu-item-desc">'+item.desc+'</div>':'')+'</div><div class="menu-item-price">'+item.p+'</div></div>';
      }).join("");
    }).join("");
  } else {
    menuSec.style.display="none";
  }
  document.getElementById("standSheet").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closeSheet(){
  document.getElementById("standSheet").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

// Init position centrée
window.addEventListener("load",function(){
  var container=document.getElementById("mapContainer");
  tx=(container.clientWidth-900*scale)/2;
  ty=(container.clientHeight-700*scale)/2;
  tx=Math.max(tx,0);ty=Math.max(ty,0);
  applyTransform();
  renderPins();
});
</script>
