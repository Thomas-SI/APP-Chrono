<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>[NOM] · Suivi Live</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--blue:#034065;--green:#50af31;--blue-dark:#022d47;--green-dark:#3d8a25;}
body{background:var(--blue-dark);font-family:'Barlow',sans-serif;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;}

.bg-terrain{position:fixed;inset:0;z-index:0;background:var(--blue-dark);overflow:hidden;}
.bg-terrain svg{width:100%;height:100%;opacity:0.18;}
.bg-glow{position:fixed;top:-20%;left:-10%;width:70%;height:70%;background:radial-gradient(ellipse,rgba(80,175,49,0.12) 0%,transparent 70%);z-index:1;pointer-events:none;}

.page{position:relative;z-index:2;width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:0.05em;color:#fff;}
.brand span{color:var(--green);}
.live-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(80,175,49,0.15);border:0.5px solid rgba(80,175,49,0.4);border-radius:20px;padding:5px 11px;font-size:11px;color:#7fce5e;font-weight:600;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#50af31;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.35;transform:scale(0.65);}}

/* EVENT SELECTOR */
.event-selector{margin:18px 20px 0;}
.event-label{font-size:10px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:8px;}
.event-dropdown{position:relative;}
.event-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.15);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;}
.event-btn-left{display:flex;align-items:center;gap:10px;}
.event-emoji{font-size:20px;}
.event-btn-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:#fff;line-height:1.1;}
.event-btn-date{font-size:11px;color:rgba(255,255,255,0.5);margin-top:1px;}
.event-chevron{color:rgba(255,255,255,0.5);transition:transform 0.2s;flex-shrink:0;}
.event-chevron.open{transform:rotate(180deg);}
.event-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#022d47;border:0.5px solid rgba(255,255,255,0.15);border-radius:12px;overflow:hidden;z-index:50;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.event-menu.open{display:block;}
.event-option{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:0.5px solid rgba(255,255,255,0.08);}
.event-option:last-child{border-bottom:none;}
.event-option:active{background:rgba(255,255,255,0.05);}
.event-option.active{background:rgba(80,175,49,0.1);}
.event-option-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.event-option-date{font-size:11px;color:rgba(255,255,255,0.45);}
.event-option-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;margin-left:auto;flex-shrink:0;}
.event-option-badge.live{background:rgba(80,175,49,0.2);color:#7fce5e;}
.event-option-badge.soon{background:rgba(255,200,0,0.15);color:rgba(255,200,0,0.9);}

/* HERO */
.hero{padding:22px 20px 0;animation:fadeUp 0.5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:0.12em;color:var(--green);text-transform:uppercase;margin-bottom:8px;}
.hero-title{font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:800;line-height:0.95;letter-spacing:-0.01em;color:#fff;margin-bottom:8px;}
.hero-title .outline{-webkit-text-stroke:1.5px rgba(255,255,255,0.35);color:transparent;}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.6);line-height:1.5;}

/* COUNTDOWN */
.countdown-card{margin:18px 20px 0;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 18px;animation:fadeUp 0.5s 0.05s ease both;}
.cd-label{font-size:10px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:10px;}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.cd-block{text-align:center;}
.cd-val{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:800;color:#fff;line-height:1;display:block;}
.cd-unit{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;display:block;}

/* COURSES */
.courses-card{margin:12px 20px 0;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;overflow:hidden;animation:fadeUp 0.5s 0.1s ease both;}
.courses-header{background:rgba(80,175,49,0.1);border-bottom:0.5px solid rgba(255,255,255,0.08);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.courses-header-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.courses-header-sub{font-size:11px;color:rgba(255,255,255,0.4);}
.race-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:0.5px solid rgba(255,255,255,0.06);cursor:pointer;}
.race-row:last-child{border-bottom:none;}
.race-row:active{background:rgba(255,255,255,0.04);}
.race-left{display:flex;align-items:center;gap:9px;}
.race-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.race-dot.live{background:var(--green);animation:pulse 1.4s ease-in-out infinite;}
.race-dot.finished{background:rgba(255,255,255,0.3);}
.race-dot.soon{background:rgba(255,200,0,0.7);}
.race-name-t{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.race-dist{font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;}
.race-status{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;}
.race-status.live{background:rgba(80,175,49,0.2);color:#7fce5e;}
.race-status.finished{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.4);}
.race-status.soon{background:rgba(255,200,0,0.1);color:rgba(255,200,0,0.85);}

/* STATS */
.stats-section{margin:12px 20px 0;animation:fadeUp 0.5s 0.15s ease both;}
.stats-title{font-size:10px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:8px;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-card{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 8px;text-align:center;}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:#fff;display:block;line-height:1;}
.stat-num.green{color:var(--green);}
.stat-unit{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;display:block;}

/* PROFIL */
.parcours-section{margin:12px 20px 0;animation:fadeUp 0.5s 0.18s ease both;}
.parcours-card{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;}
.parcours-label{font-size:10px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:10px;}
.profile-svg{width:100%;height:72px;}
.cp-strip{display:flex;gap:0;margin-top:8px;overflow-x:auto;scrollbar-width:none;}
.cp-strip::-webkit-scrollbar{display:none;}
.cp-item{flex-shrink:0;text-align:center;padding:0 8px;}
.cp-item:first-child{padding-left:0;}
.cp-dot-s{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.2);margin:0 auto 3px;}
.cp-dot-s.passed{background:var(--green);}
.cp-dot-s.current{background:#fff;animation:pulse 1.4s ease-in-out infinite;}
.cp-name-s{font-size:9px;color:rgba(255,255,255,0.45);white-space:nowrap;}
.cp-km-s{font-size:8px;color:rgba(255,255,255,0.3);}

/* AMBIANCE */
.ambiance{margin:12px 20px 0;border-radius:14px;overflow:hidden;height:100px;position:relative;animation:fadeUp 0.5s 0.2s ease both;cursor:pointer;}
.ambiance:active{opacity:0.9;}
.ambiance-bg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.ambiance-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(2,45,71,0.7) 100%);}
.ambiance-content{position:relative;z-index:1;text-align:center;}
.ambiance-main{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.ambiance-sub{font-size:11px;color:rgba(255,255,255,0.6);margin-top:3px;}
.ambiance-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.6);}

/* CTA BUTTONS */
.cta-section{margin:16px 20px 0;display:flex;flex-direction:column;gap:10px;animation:fadeUp 0.5s 0.25s ease both;}
.cta-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border:none;border-radius:14px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:0.04em;cursor:pointer;transition:opacity 0.15s;}
.cta-btn:active{opacity:0.85;}
.cta-btn.primary{background:var(--green);}
.cta-btn.secondary{background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.2);}
.cta-sub{text-align:center;font-size:11px;color:rgba(255,255,255,0.35);margin-top:-4px;}

/* FOOTER */
.page-footer{padding:24px 20px;text-align:center;margin-top:auto;}
.footer-brand{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;color:rgba(255,255,255,0.25);}
.footer-brand span{color:rgba(80,175,49,0.6);}

</style>

  <!-- SELECTEUR EVENEMENT -->
  <div class="event-selector">
    <div class="event-label">Événement</div>
    <div class="event-dropdown">
      <div class="event-btn" onclick="toggleMenu()">

    </div>
  </div>

  <!-- CONTENU DYNAMIQUE -->
  <div id="eventContent"></div>

  <div class="page-footer">
    <div class="footer-brand">[<span>NOM</span>] · Suivi live de course</div>
  </div>
</div>

var currentEvent = "utmb";
var menuOpen = false;

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById("eventMenu").classList.toggle("open", menuOpen);
  document.getElementById("chevron").classList.toggle("open", menuOpen);
}

function selectEvent(id) {
  currentEvent = id;
  menuOpen = false;
  document.getElementById("eventMenu").classList.remove("open");
  document.getElementById("chevron").classList.remove("open");
  var opts = document.querySelectorAll(".event-option");
  opts.forEach(function(o, i) { o.classList.toggle("active", i === (id==="utmb"?0:1)); });
  var ev = events[id];
  document.getElementById("btnEmoji").textContent = ev.emoji;
  document.getElementById("btnName").textContent = ev.name;
  document.getElementById("btnDate").textContent = ev.date;
  renderEvent(id);
}

function pad(n){return n<10?"0"+n:String(n);}
var cdInterval = null;

function startCountdown(target) {
  if(cdInterval) clearInterval(cdInterval);
  function update() {
    var diff = Math.max(0, target - new Date());
    var d=Math.floor(diff/86400000);
    var h=Math.floor((diff%86400000)/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    var el = document.getElementById("cdVals");
    if(el) el.innerHTML =
      '<div class="cd-block"><span class="cd-val">'+pad(d)+'</span><span class="cd-unit">Jours</span></div>'+
      '<div class="cd-block"><span class="cd-val">'+pad(h)+'</span><span class="cd-unit">Heures</span></div>'+
      '<div class="cd-block"><span class="cd-val">'+pad(m)+'</span><span class="cd-unit">Min</span></div>'+
      '<div class="cd-block"><span class="cd-val">'+pad(s)+'</span><span class="cd-unit">Sec</span></div>';
  }
  update();
  cdInterval = setInterval(update, 1000);
}

function renderEvent(id) {
  var ev = events[id];
  var racesHtml = ev.races.map(function(r){
    var dotClass = r.status==="live"?"live":r.status==="finished"?"finished":"soon";
    var lblClass = dotClass;
    var lbl = r.status==="live"?"En cours":r.status==="finished"?"Termin\u00e9e":"Bient\u00f4t";
    return '<div class="race-row" onclick="window.location.href=\''+ev.classementUrl+'\'">'+
      '<div class="race-left"><div class="race-dot '+dotClass+'"></div>'+
      '<div><div class="race-name-t">'+r.name+'</div><div class="race-dist">'+r.dist+'</div></div></div>'+
      '<div style="display:flex;align-items:center;gap:6px;">'+
      '<span class="race-status '+lblClass+'">'+lbl+'</span>'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'+
      '</div></div>';
  }).join("");

  var cpHtml = ev.profil.checkpoints.map(function(cp){
    return '<div class="cp-item">'+
      '<div class="cp-dot-s '+cp.state+'"></div>'+
      '<div class="cp-name-s">'+cp.name+'</div>'+
      '<div class="cp-km-s">km '+cp.km+'</div>'+
      '</div>';
  }).join("");

  var mountainsSvg = ev.ambiance.mountains ?
    '<svg style="position:absolute;bottom:0;left:0;right:0;width:100%" viewBox="0 0 430 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M0 100 L50 55 L100 70 L160 25 L200 45 L230 10 L260 38 L310 18 L360 42 L430 30 L430 100Z" fill="rgba(0,0,0,0.2)"/>'+
    '<path d="M0 100 L60 65 L120 75 L180 50 L220 60 L255 38 L290 55 L340 42 L390 58 L430 50 L430 100Z" fill="rgba(0,0,0,0.3)"/>'+
    '</svg>' : '';

  var lakeScene = !ev.ambiance.mountains ?
    '<svg style="position:absolute;bottom:0;left:0;right:0;width:100%" viewBox="0 0 430 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
    '<path d="M0 80 Q215 60 430 80 L430 100 L0 100Z" fill="rgba(0,60,100,0.4)"/>'+
    '<path d="M0 90 Q215 75 430 90 L430 100 L0 100Z" fill="rgba(0,80,130,0.3)"/>'+
    '<path d="M40 68 L50 55 L60 68Z" fill="rgba(255,255,255,0.1)"/>'+
    '<path d="M340 60 L355 45 L370 60Z" fill="rgba(255,255,255,0.1)"/>'+
    '</svg>' : '';

  var cdLabel = ev.status === "live" ? "Prochain d\u00e9part dans" : "D\u00e9part dans";

  var html =
    '<div class="hero">'+
    '<div class="hero-eyebrow">'+ev.eyebrow+'</div>'+
    '<div class="hero-title">'+ev.titleLines.join('<br>')+'</div>'+
    '<div class="hero-sub">'+ev.sub+'</div>'+
    '</div>'+

    '<div class="countdown-card">'+
    '<div class="cd-label">'+cdLabel+'</div>'+
    '<div class="cd-grid" id="cdVals"></div>'+
    '</div>'+

    '<div class="courses-card">'+
    '<div class="courses-header">'+
    '<div><div class="courses-header-title">Les courses</div><div class="courses-header-sub">'+ev.name+'</div></div>'+
    '</div>'+
    racesHtml+
    '</div>'+

    '<div class="stats-section">'+
    '<div class="stats-title">En ce moment</div>'+
    '<div class="stats-grid">'+
    '<div class="stat-card"><span class="stat-num green">'+ev.stats.running.toLocaleString('fr')+'</span><span class="stat-unit">En course</span></div>'+
    '<div class="stat-card"><span class="stat-num">'+ev.stats.finished.toLocaleString('fr')+'</span><span class="stat-unit">Arriv\u00e9s</span></div>'+
    '<div class="stat-card"><span class="stat-num">'+ev.stats.abandons+'</span><span class="stat-unit">Abandons</span></div>'+
    '</div></div>'+

    '<div class="parcours-section">'+
    '<div class="parcours-card">'+
    '<div class="parcours-label">'+ev.profil.label+'</div>'+
    '<svg class="profile-svg" viewBox="0 0 360 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#50af31" stop-opacity="0.4"/><stop offset="100%" stop-color="#50af31" stop-opacity="0.02"/></linearGradient></defs>'+
    '<path d="'+ev.profil.path+'" fill="none" stroke="#50af31" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="'+ev.profil.path+' L360 72 L0 72Z" fill="url(#pg)"/>'+
    '</svg>'+
    '<div class="cp-strip">'+cpHtml+'</div>'+
    '</div></div>'+

    '<div class="ambiance" style="animation:fadeUp 0.5s 0.22s ease both;">'+
    '<div class="ambiance-bg" style="background:'+ev.ambiance.bg+'">'+
    mountainsSvg + lakeScene +
    '<div class="ambiance-overlay"></div>'+
    '<div class="ambiance-content">'+
    '<div class="ambiance-main">'+ev.ambiance.main+'</div>'+
    '<div class="ambiance-sub">'+ev.ambiance.sub+'</div>'+
    '</div>'+
    '<svg class="ambiance-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'+
    '</div></div>'+

    '<div class="cta-section">'+
    '<button class="cta-btn primary" onclick="window.location.href=\''+ev.classementUrl+'\'">'+
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>'+
    'Suivre les coureurs en live'+
    '</button>'+
    '<div class="cta-sub">Classement \u00b7 Favoris \u00b7 Notifications</div>'+
    '<button class="cta-btn secondary" onclick="window.location.href=\''+ev.villageUrl+'\'">'+
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+
    'Plan du Village'+
    '</button>'+
    '<div class="cta-sub">Stands \u00b7 Restauration \u00b7 Marques \u00b7 Animations</div>'+
    '</div>';

  document.getElementById("eventContent").innerHTML = html;
  startCountdown(ev.countdown);
}

// Fermer menu si clic ailleurs
document.addEventListener("click", function(e){
  if(menuOpen && !e.target.closest(".event-dropdown")){
    menuOpen=false;
    document.getElementById("eventMenu").classList.remove("open");
    document.getElementById("chevron").classList.remove("open");
  }
});

var isDark=localStorage.getItem("theme")==="dark";
function applyTheme(){
  if(isDark){
    document.body.classList.remove("light");
    document.getElementById("themeLabel").textContent="Clair";
    document.getElementById("themeIcon").innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    document.body.classList.add("light");
    document.getElementById("themeLabel").textContent="Sombre";
    document.getElementById("themeIcon").innerHTML='<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}
function toggleTheme(){isDark=!isDark;localStorage.setItem("theme",isDark?"dark":"light");applyTheme();}
applyTheme();
renderEvent("utmb");
</script>
